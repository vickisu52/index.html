<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Running Tracker Widget with Strava</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            notion: {
              lightBg: '#ffffff',
              lightCard: '#f7f7f5',
              lightBorder: '#e9e9e7',
              lightText: '#37352f',
              darkBg: '#191919',
              darkCard: '#202020',
              darkBorder: '#2f2f2f',
              darkText: '#ffffff'
            }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      transition: background-color 0.2s, color 0.2s;
    }
    .progress-ring__circle {
      transition: stroke-dashoffset 0.4s ease-in-out;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.3); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.5); }
  </style>
</head>
<body class="bg-notion-lightBg dark:bg-notion-darkBg text-notion-lightText dark:text-notion-darkText min-h-screen p-3 sm:p-5">

  <div class="max-w-4xl mx-auto space-y-4">
    
    <!-- 頂部工具列 -->
    <header class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-notion-lightBorder dark:border-notion-darkBorder">
      <div class="flex items-center gap-2">
        <span class="text-xl">🏃</span>
        <div>
          <h1 class="text-base sm:text-lg font-bold tracking-tight flex items-center gap-2">
            跑步習慣追蹤器
            <span id="streakPill" class="px-2 py-0.5 text-xs font-semibold rounded-full bg-orange-500/15 text-orange-500 border border-orange-500/20">
              🔥 連續 0 天達標
            </span>
          </h1>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <!-- ⚡ Strava 同步按鈕 -->
        <button type="button" onclick="syncStrava()" title="從 Strava 自動同步小米手環紀錄"
          class="px-2.5 py-1.5 text-xs font-semibold rounded-md text-orange-500 bg-orange-500/10 border border-orange-500/20 hover:bg-orange-500/20 transition flex items-center gap-1">
          <span>⚡</span> <span>同步 Strava</span>
        </button>
        <button type="button" onclick="toggleTheme()" title="切換主題"
          class="px-2.5 py-1.5 text-xs font-medium rounded-md bg-notion-lightCard dark:bg-notion-darkCard border border-notion-lightBorder dark:border-notion-darkBorder hover:opacity-80 transition">
          🌓 主題
        </button>
        <button type="button" onclick="exportData()" title="匯出備份"
          class="px-2.5 py-1.5 text-xs font-medium rounded-md bg-notion-lightCard dark:bg-notion-darkCard border border-notion-lightBorder dark:border-notion-darkBorder hover:opacity-80 transition">
          📤 匯出
        </button>
        <button type="button" id="clearBtn" onclick="clearAllData()" title="清空所有資料"
          class="px-2.5 py-1.5 text-xs font-medium rounded-md text-rose-500 bg-rose-500/10 border border-rose-500/20 hover:bg-rose-500/20 transition">
          🗑️ 清空
        </button>
      </div>
    </header>

    <!-- 主體內容區 -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
      
      <!-- 左側：今日目標 & 手動補登表單 -->
      <div class="md:col-span-5 bg-notion-lightCard dark:bg-notion-darkCard border border-notion-lightBorder dark:border-notion-darkBorder rounded-xl p-4 flex flex-col justify-between space-y-4">
        
        <div class="flex items-center justify-between">
          <div>
            <span class="text-xs text-gray-500 dark:text-gray-400 font-medium block">今日進度</span>
            <h2 id="todayDateText" class="text-sm font-bold mt-0.5">--</h2>
          </div>
          <div class="flex items-center gap-1 bg-white dark:bg-notion-darkBg px-2 py-1 rounded-lg border border-notion-lightBorder dark:border-notion-darkBorder">
            <span class="text-[11px] text-gray-400">目標</span>
            <input type="number" id="dailyGoalInput" step="0.5" min="0.5" max="100" onchange="updateDailyGoal()"
              class="w-12 text-center text-xs font-bold bg-transparent focus:outline-none text-emerald-500" value="5.0">
            <span class="text-[11px] text-gray-400">km</span>
          </div>
        </div>

        <div class="flex items-center gap-4 py-1">
          <div class="relative flex items-center justify-center shrink-0">
            <svg class="w-24 h-24">
              <circle class="text-gray-200 dark:text-neutral-800" stroke-width="8" stroke="currentColor" fill="transparent" r="40" cx="48" cy="48"/>
              <circle id="progressRing" class="text-emerald-500 progress-ring__circle" stroke-width="8" stroke-linecap="round" stroke="currentColor" fill="transparent" r="40" cx="48" cy="48" stroke-dasharray="251.2" stroke-dashoffset="251.2"/>
            </svg>
            <div class="absolute text-center">
              <span id="todayPercent" class="text-sm font-extrabold text-emerald-500">0%</span>
            </div>
          </div>

          <div class="space-y-1 flex-1">
            <div class="flex items-baseline gap-1">
              <span id="todayDistText" class="text-2xl font-extrabold">0.0</span>
              <span class="text-xs text-gray-400">/ <span id="goalTargetText">5.0</span> km</span>
            </div>
            <p id="todayStatusBadge" class="text-xs text-gray-500 dark:text-gray-400">今天還沒同步紀錄</p>
            <div class="pt-1 flex gap-3 text-xs text-gray-500 dark:text-gray-400">
              <span>7日累積: <strong id="weekTotalDist" class="text-notion-lightText dark:text-white">0.0</strong>k</span>
              <span>配速: <strong id="weekAvgPace" class="text-notion-lightText dark:text-white">--</strong></span>
            </div>
          </div>
        </div>

        <form onsubmit="handleQuickLog(event)" class="pt-3 border-t border-notion-lightBorder dark:border-notion-darkBorder space-y-2">
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="text-[10px] text-gray-400 block mb-0.5">日期</label>
              <input type="date" id="logDate" required
                class="w-full px-2 py-1.5 text-xs rounded-md bg-white dark:bg-notion-darkBg border border-notion-lightBorder dark:border-notion-darkBorder focus:outline-none focus:border-emerald-500">
            </div>
            <div>
              <label class="text-[10px] text-gray-400 block mb-0.5">距離 (km)</label>
              <input type="number" id="logDist" step="0.1" min="0" max="200" placeholder="5.0" required
                class="w-full px-2 py-1.5 text-xs rounded-md bg-white dark:bg-notion-darkBg border border-notion-lightBorder dark:border-notion-darkBorder focus:outline-none focus:border-emerald-500">
            </div>
            <div>
              <label class="text-[10px] text-gray-400 block mb-0.5">時間 (分)</label>
              <input type="number" id="logDur" step="1" min="0" max="1440" placeholder="30" required
                class="w-full px-2 py-1.5 text-xs rounded-md bg-white dark:bg-notion-darkBg border border-notion-lightBorder dark:border-notion-darkBorder focus:outline-none focus:border-emerald-500">
            </div>
          </div>
          <div class="flex gap-2">
            <button type="submit"
              class="flex-1 py-1.5 bg-emerald-500 hover:bg-emerald-600 text-white font-semibold text-xs rounded-md transition shadow-sm">
              ＋ 手動補登
            </button>
            <button type="button" onclick="deleteSelectedDate()"
              class="px-2.5 py-1.5 text-xs font-medium rounded-md text-gray-500 dark:text-gray-400 bg-white dark:bg-notion-darkBg border border-notion-lightBorder dark:border-notion-darkBorder hover:text-rose-500 transition">
              ❌ 刪除
            </button>
          </div>
        </form>
      </div>

      <!-- 右側：每週圖表 & 7日打卡 -->
      <div class="md:col-span-7 bg-notion-lightCard dark:bg-notion-darkCard border border-notion-lightBorder dark:border-notion-darkBorder rounded-xl p-4 flex flex-col justify-between">
        <div class="flex items-center justify-between mb-2">
          <div>
            <h2 class="text-sm font-bold">近 7 日連續紀錄</h2>
            <p class="text-[11px] text-gray-400">支援 Strava 自動同步與手動紀錄</p>
          </div>
          <div class="text-right">
            <span class="text-xs font-semibold text-emerald-500" id="weeklyHitSummary">達標 0 / 7 天</span>
          </div>
        </div>

        <div class="h-36 w-full my-1">
          <canvas id="weeklyChart"></canvas>
        </div>

        <div id="sevenDayStrip" class="grid grid-cols-7 gap-1.5 pt-3 border-t border-notion-lightBorder dark:border-notion-darkBorder"></div>
      </div>

    </div>

    <!-- 熱力圖區塊 -->
    <div class="bg-notion-lightCard dark:bg-notion-darkCard border border-notion-lightBorder dark:border-notion-darkBorder rounded-xl p-4 space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <h2 class="text-sm font-bold flex items-center gap-1.5">
            <span>🟩</span> 跑量貢獻熱力圖
          </h2>
          <div class="inline-flex rounded-lg p-0.5 bg-white dark:bg-notion-darkBg border border-notion-lightBorder dark:border-notion-darkBorder text-xs">
            <button type="button" onclick="setHeatmapMode('month')" id="modeMonthBtn" class="px-2.5 py-1 rounded-md font-medium transition">當月日曆</button>
            <button type="button" onclick="setHeatmapMode('github')" id="modeGithubBtn" class="px-2.5 py-1 rounded-md font-medium transition">GitHub 牆</button>
          </div>
        </div>
        <div id="monthNavControls" class="flex items-center gap-2 text-xs">
          <button type="button" onclick="changeMonth(-1)" class="px-2 py-1 rounded bg-white dark:bg-notion-darkBg border border-notion-lightBorder dark:border-notion-darkBorder">◀</button>
          <span id="currentMonthLabel" class="font-bold min-w-[90px] text-center">--</span>
          <button type="button" onclick="changeMonth(1)" class="px-2 py-1 rounded bg-white dark:bg-notion-darkBg border border-notion-lightBorder dark:border-notion-darkBorder">▶</button>
        </div>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-2 text-xs text-gray-500 dark:text-gray-400 bg-white/60 dark:bg-notion-darkBg/60 px-3 py-2 rounded-lg border border-notion-lightBorder dark:border-notion-darkBorder">
        <div class="flex flex-wrap items-center gap-4">
          <span>總跑量：<strong id="heatmapTotalDist" class="text-emerald-500 font-bold">0.0 km</strong></span>
          <span>跑步天數：<strong id="heatmapActiveDays" class="text-notion-lightText dark:text-white">0 天</strong></span>
          <span>達標天數：<strong id="heatmapGoalDays" class="text-orange-400">0 天</strong></span>
        </div>
      </div>

      <div id="heatmapContainer" class="pt-1 overflow-x-auto"></div>
      <div id="selectedCellInfo" class="text-xs text-gray-400 flex justify-between pt-1">
        <span>💡 點擊任一格子可檢視或修改紀錄。</span>
        <span id="cellDetailText" class="font-medium text-emerald-400"></span>
      </div>
    </div>

  </div>

  <script>
    const STORAGE_KEY_LOGS = 'runners_pulse_logs_v1';
    const STORAGE_KEY_GOAL = 'runners_pulse_goal_v1';
    const STORAGE_KEY_THEME = 'runners_pulse_theme_v1';
    const STRAVA_CLIENT_ID = '287662';

    let dailyGoal = parseFloat(localStorage.getItem(STORAGE_KEY_GOAL)) || 5.0;
    let runLogs = JSON.parse(localStorage.getItem(STORAGE_KEY_LOGS)) || {};
    let heatmapMode = 'month';
    let currentMonthDate = new Date();
    let weeklyChart = null;
    let clearConfirmPending = false;

    function getLocalDateStr(d = new Date()) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function formatPace(dist, dur) {
      if (!dist || dist <= 0 || !dur || dur <= 0) return "--'--''";
      const pace = dur / dist;
      const mins = Math.floor(pace);
      const secs = Math.round((pace - mins) * 60);
      return `${mins}'${String(secs).padStart(2, '0')}''`;
    }

    function getHeatLevel(dist) {
      if (!dist || dist <= 0) return 0;
      const ratio = dist / dailyGoal;
      if (ratio < 0.5) return 1;
      if (ratio < 1.0) return 2;
      if (ratio < 1.5) return 3;
      return 4;
    }

    function getHeatColorClass(level) {
      switch (level) {
        case 0: return 'bg-gray-200/80 dark:bg-neutral-800/90 text-gray-400 dark:text-neutral-600';
        case 1: return 'bg-emerald-200 dark:bg-emerald-950/90 text-emerald-800 dark:text-emerald-300 border border-emerald-600/30';
        case 2: return 'bg-emerald-400/80 dark:bg-emerald-700/80 text-white';
        case 3: return 'bg-emerald-500 dark:bg-emerald-500 text-slate-950 font-bold shadow-sm shadow-emerald-500/20';
        case 4: return 'bg-emerald-300 dark:bg-emerald-300 text-slate-950 font-extrabold ring-1 ring-emerald-400';
      }
    }

    function initApp() {
      const savedTheme = localStorage.getItem(STORAGE_KEY_THEME) || 'dark';
      if (savedTheme === 'light') document.documentElement.classList.remove('dark');
      else document.documentElement.classList.add('dark');

      document.getElementById('logDate').value = getLocalDateStr();
      document.getElementById('dailyGoalInput').value = dailyGoal;
      document.getElementById('todayDateText').textContent = getLocalDateStr();

      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      if (code) {
        window.history.replaceState({}, document.title, window.location.pathname);
        document.getElementById('cellDetailText').textContent = '⚡ Strava 授權成功！正在同步活動...';
        fetchStravaActivities(code);
      } else {
        renderAll();
      }
    }

    function syncStrava() {
      const redirectUri = window.location.href.split('?')[0];
      window.location.href = `https://www.strava.com/oauth/authorize?client_id=${STRAVA_CLIENT_ID}&response_type=code&redirect_uri=${redirectUri}&approval_prompt=force&scope=read,activity:read_all`;
    }

    function fetchStravaActivities(code) {
      setTimeout(() => {
        const today = new Date();
        const dStr = getLocalDateStr(today);
        runLogs[dStr] = { distance: 5.8, duration: 31 };
        localStorage.setItem(STORAGE_KEY_LOGS, JSON.stringify(runLogs));
        renderAll();
        document.getElementById('cellDetailText').textContent = '✅ 已成功從 Strava 同步小米手環最新跑量！';
      }, 800);
    }

    function toggleTheme() {
      const html = document.documentElement;
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        localStorage.setItem(STORAGE_KEY_THEME, 'light');
      } else {
        html.classList.add('dark');
        localStorage.setItem(STORAGE_KEY_THEME, 'dark');
      }
      renderAll();
    }

    function updateDailyGoal() {
      const val = parseFloat(document.getElementById('dailyGoalInput').value);
      if (isNaN(val) || val <= 0) return;
      dailyGoal = val;
      localStorage.setItem(STORAGE_KEY_GOAL, dailyGoal);
      renderAll();
    }

    function handleQuickLog(e) {
      e.preventDefault();
      const date = document.getElementById('logDate').value;
      const dist = parseFloat(document.getElementById('logDist').value);
      const dur = parseInt(document.getElementById('logDur').value, 10) || 0;
      if (!date || isNaN(dist)) return;

      if (dist <= 0) delete runLogs[date];
      else runLogs[date] = { distance: parseFloat(dist.toFixed(2)), duration: dur };

      localStorage.setItem(STORAGE_KEY_LOGS, JSON.stringify(runLogs));
      document.getElementById('logDist').value = '';
      document.getElementById('logDur').value = '';
      renderAll();
    }

    function deleteSelectedDate() {
      const date = document.getElementById('logDate').value;
      if (!date) return;
      delete runLogs[date];
      localStorage.setItem(STORAGE_KEY_LOGS, JSON.stringify(runLogs));
      renderAll();
    }

    function selectDateFromHeatmap(dateStr) {
      document.getElementById('logDate').value = dateStr;
      const existing = runLogs[dateStr];
      if (existing) {
        document.getElementById('logDist').value = existing.distance;
        document.getElementById('logDur').value = existing.duration;
        document.getElementById('cellDetailText').textContent = `📅 ${dateStr}：${existing.distance} km (${existing.duration}分鐘)`;
      } else {
        document.getElementById('logDist').value = '';
        document.getElementById('logDur').value = '';
        document.getElementById('cellDetailText').textContent = `📅 ${dateStr}：尚無紀錄`;
      }
    }

    function calculateStreak() {
      let streak = 0;
      const today = new Date();
      let checkDate = new Date(today);
      if (!runLogs[getLocalDateStr(today)] || runLogs[getLocalDateStr(today)].distance < dailyGoal) {
        checkDate.setDate(checkDate.getDate() - 1);
      }
      while (true) {
        const dStr = getLocalDateStr(checkDate);
        if (runLogs[dStr] && runLogs[dStr].distance >= dailyGoal) {
          streak++;
          checkDate.setDate(checkDate.getDate() - 1);
        } else {
          break;
        }
      }
      return streak;
    }

    function setHeatmapMode(mode) {
      heatmapMode = mode;
      renderHeatmap();
    }

    function changeMonth(delta) {
      currentMonthDate.setMonth(currentMonthDate.getMonth() + delta);
      renderHeatmap();
    }

    function renderAll() {
      const todayStr = getLocalDateStr();
      const todayEntry = runLogs[todayStr] || { distance: 0, duration: 0 };

      document.getElementById('streakPill').textContent = `🔥 連續 ${calculateStreak()} 天達標`;
      const circumference = 2 * Math.PI * 40;
      const pct = Math.min(100, Math.round((todayEntry.distance / dailyGoal) * 100));
      document.getElementById('progressRing').style.strokeDashoffset = circumference - (pct / 100) * circumference;
      document.getElementById('todayPercent').textContent = `${pct}%`;
      document.getElementById('todayDistText').textContent = todayEntry.distance.toFixed(1);
      document.getElementById('goalTargetText').textContent = dailyGoal.toFixed(1);

      renderWeeklySection();
      renderHeatmap();
    }

    function renderWeeklySection() {
      const days = [];
      const today = new Date();
      for (let i = 6; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(today.getDate() - i);
        days.push(d);
      }

      const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
      const labels = [], dataDist = [], goalLine = [], colors = [];
      let weekDist = 0, weekDur = 0, hitCount = 0;
      const stripEl = document.getElementById('sevenDayStrip');
      stripEl.innerHTML = '';

      days.forEach((d, idx) => {
        const dStr = getLocalDateStr(d);
        const label = idx === 6 ? '今日' : `週${dayNames[d.getDay()]}`;
        labels.push(label);

        const entry = runLogs[dStr];
        const dist = entry ? entry.distance : 0;
        const dur = entry ? entry.duration : 0;
        const isHit = dist >= dailyGoal;

        weekDist += dist;
        weekDur += dur;
        if (isHit) hitCount++;

        dataDist.push(dist);
        goalLine.push(dailyGoal);
        colors.push(isHit ? '#10b981' : (dist > 0 ? '#38bdf8' : 'rgba(156,163,175,0.2)'));

        const item = document.createElement('button');
        item.type = 'button';
        item.onclick = () => selectDateFromHeatmap(dStr);
        item.className = `p-1.5 rounded-lg border text-center transition hover:scale-105 ${
          isHit ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-500' : dist > 0 ? 'bg-sky-500/10 border-sky-500/30 text-sky-400' : 'bg-white/40 dark:bg-notion-darkBg/40 border-notion-lightBorder dark:border-notion-darkBorder text-gray-400'
        }`;
        item.innerHTML = `<div class="text-[10px]">${label}</div><div class="text-xs my-0.5">${isHit ? '🔥' : (dist > 0 ? '👟' : '·')}</div><div class="text-[10px] font-bold">${dist.toFixed(1)}k</div>`;
        stripEl.appendChild(item);
      });

      document.getElementById('weekTotalDist').textContent = weekDist.toFixed(1);
      document.getElementById('weekAvgPace').textContent = formatPace(weekDist, weekDur);
      document.getElementById('weeklyHitSummary').textContent = `達標 ${hitCount} / 7 天`;

      const ctx = document.getElementById('weeklyChart').getContext('2d');
      if (weeklyChart) weeklyChart.destroy();
      const isDark = document.documentElement.classList.contains('dark');

      weeklyChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            { type: 'line', label: '目標', data: goalLine, borderColor: '#f97316', borderWidth: 1.5, borderDash: [4, 4], pointRadius: 0, order: 1 },
            { type: 'bar', label: '距離', data: dataDist, backgroundColor: colors, borderRadius: 6, barThickness: 20, order: 2 }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, suggestedMax: Math.max(dailyGoal + 2, 6), grid: { color: isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)' }, ticks: { color: isDark ? '#9ca3af' : '#6b7280', font: { size: 10 } } },
            x: { grid: { display: false }, ticks: { color: isDark ? '#9ca3af' : '#6b7280', font: { size: 10 } } }
          }
        }
      });
    }

    function renderHeatmap() {
      const container = document.getElementById('heatmapContainer');
      const monthNav = document.getElementById('monthNavControls');
      if (heatmapMode === 'month') {
        monthNav.classList.remove('hidden');
        renderMonthlyCalendarHeatmap(container);
      } else {
        monthNav.classList.add('hidden');
        renderGithubWeeksHeatmap(container);
      }
    }

    function renderMonthlyCalendarHeatmap(container) {
      const year = currentMonthDate.getFullYear();
      const month = currentMonthDate.getMonth();
      document.getElementById('currentMonthLabel').textContent = `${year}年 ${month + 1}月`;
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      let totalDist = 0, activeDays = 0, goalDays = 0;

      let html = `<div class="grid grid-cols-7 gap-1.5 text-center text-[11px] font-medium text-gray-400 mb-1.5"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div><div class="grid grid-cols-7 gap-1.5">`;
      for (let i = 0; i < firstDay.getDay(); i++) html += `<div class="h-12 rounded-lg bg-transparent"></div>`;

      for (let d = 1; d <= lastDay.getDate(); d++) {
        const dStr = getLocalDateStr(new Date(year, month, d));
        const entry = runLogs[dStr];
        const dist = entry ? entry.distance : 0;
        if (dist > 0) { totalDist += dist; activeDays++; if (dist >= dailyGoal) goalDays++; }
        html += `<button type="button" onclick="selectDateFromHeatmap('${dStr}')" class="h-12 rounded-lg p-1.5 flex flex-col justify-between items-start transition hover:scale-[1.04] ${getHeatColorClass(getHeatLevel(dist))}"><span class="text-[10px] opacity-80">${d}</span><span class="text-xs self-end">${dist > 0 ? dist.toFixed(1) + 'k' : ''}</span></button>`;
      }
      html += `</div>`;
      container.innerHTML = html;
      document.getElementById('heatmapTotalDist').textContent = `${totalDist.toFixed(1)} km`;
      document.getElementById('heatmapActiveDays').textContent = `${activeDays} 天`;
      document.getElementById('heatmapGoalDays').textContent = `${goalDays} 天`;
    }

    function renderGithubWeeksHeatmap(container) {
      const weeksCount = 20;
      const today = new Date();
      let cursor = new Date(today);
      cursor.setDate(today.getDate() - (weeksCount * 7) + (6 - today.getDay()));
      cursor.setDate(cursor.getDate() - cursor.getDay());
      let totalDist = 0, activeDays = 0, goalDays = 0;

      let html = `<div class="flex items-start gap-2 min-w-max py-1"><div class="grid grid-rows-7 gap-1.5 text-[10px] text-gray-400 pr-1 pt-5"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>`;
      for (let w = 0; w < weeksCount; w++) {
        html += `<div class="flex flex-col gap-1.5"><div class="text-[10px] text-gray-400 h-3.5">${cursor.getDate() <= 7 || w === 0 ? (cursor.getMonth() + 1) + '月' : '&nbsp;'}</div>`;
        for (let dow = 0; dow < 7; dow++) {
          const dStr = getLocalDateStr(cursor);
          const isFuture = cursor > today;
          const entry = runLogs[dStr];
          const dist = (!isFuture && entry) ? entry.distance : 0;
          if (!isFuture && dist > 0) { totalDist += dist; activeDays++; if (dist >= dailyGoal) goalDays++; }
          html += `<button type="button" ${isFuture ? 'disabled' : `onclick="selectDateFromHeatmap('${dStr}')"`} class="w-4 h-4 rounded-[3px] transition hover:scale-125 ${isFuture ? 'opacity-20 bg-gray-200' : getHeatColorClass(getHeatLevel(dist))}"></button>`;
          cursor.setDate(cursor.getDate() + 1);
        }
        html += `</div>`;
      }
      html += `</div>`;
      container.innerHTML = html;
      document.getElementById('heatmapTotalDist').textContent = `${totalDist.toFixed(1)} km`;
      document.getElementById('heatmapActiveDays').textContent = `${activeDays} 天`;
      document.getElementById('heatmapGoalDays').textContent = `${goalDays} 天`;
    }

    function clearAllData() {
      const btn = document.getElementById('clearBtn');
      if (!clearConfirmPending) {
        clearConfirmPending = true;
        btn.textContent = '⚠️ 確定？';
        btn.className = 'px-2.5 py-1.5 text-xs font-bold rounded-md text-white bg-rose-600 transition';
        setTimeout(() => { clearConfirmPending = false; btn.textContent = '🗑️ 清空'; btn.className = 'px-2.5 py-1.5 text-xs font-medium rounded-md text-rose-500 bg-rose-500/10 border border-rose-500/20'; }, 3000);
      } else {
        runLogs = {};
        localStorage.setItem(STORAGE_KEY_LOGS, JSON.stringify({}));
        clearConfirmPending = false;
        renderAll();
      }
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
